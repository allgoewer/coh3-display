[package]
name = "coh3-display"
version = "1.2.1"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serialport = "4"
serde ={ version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
espflash = { version = "4.6", default-features = false, features = ["serialport"] }

[dev-dependencies]
heapless = "0.9"
serde_json = "1"

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
