[package]
edition      = "2024"
name         = "firmware"
rust-version = "1.95"
version      = "1.3.1"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c6",
  "unstable",
  "wifi",
] }
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "udp",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-ipv4",
  "socket-udp",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c6"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"
embedded-graphics = "0.8.2"
embedded-io-async = "0.7.0"
ssd1306 = { version = "0.10.0", features = ["async"] }
esp-storage = { version = "0.10", features = ["esp32c6"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# What the PC app embeds: release without debug info, to keep the ELF small.
[profile.dist]
inherits = "release"
debug    = false
strip    = true
